services:
  db:
    image: postgres:18-alpine
    container_name: ec_database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 3
    ports:
      - "${DATABASE_PORT}:${DATABASE_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: ec_backend
    environment:
      DATABASE_WRITER_URL: ${DATABASE_WRITER_URL}
      DATABASE_READER_URL: ${DATABASE_READER_URL}
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_PORT: ${BACKEND_PORT}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src/backend/uploads:/app/uploads

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: ec_frontend
    environment:
      VITE_API_URL: ${VITE_API_URL}
      FRONTEND_PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend

volumes:
  postgres_data:
